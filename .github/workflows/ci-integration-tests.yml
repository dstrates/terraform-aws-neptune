name: Integration Tests
run-name: Integration Tests by @${{ github.actor }} ${{ github.sha }}

on:
  workflow_dispatch:

jobs:
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for OIDC credential vending

    strategy:
      # Run test functions in parallel across matrix entries. Each entry maps
      # to a single -run pattern so tests get isolated Terraform state and can
      # be retried or cancelled independently.
      fail-fast: false
      matrix:
        test:
          - TestNeptuneServerlessCluster

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: test/go.mod
          cache-dependency-path: test/go.sum

      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Run ${{ matrix.test }}
        working-directory: test
        run: go test -v -run "${{ matrix.test }}$" -timeout 60m
